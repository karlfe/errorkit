[project]
name = "errorkit"
version = "0.1.0"
description = "Extendable, shareable error catalog with severity-based and error-specific actions"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10"
dependencies = []
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]

[project.urls]
Homepage = "https://github.com/yourorg/errorkit"
Changelog = "https://github.com/yourorg/errorkit/blob/main/CHANGELOG.md"

[project.optional-dependencies]
yaml = ["pyyaml"]
dev = ["pytest>=7", "pytest-cov", "build", "twine"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
